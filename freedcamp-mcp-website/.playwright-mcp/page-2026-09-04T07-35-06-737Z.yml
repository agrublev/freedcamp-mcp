      - generic [ref=e3204]:
        - generic [ref=e3205]:
          - generic [ref=e3206]: "08"
          - generic [ref=e3207]: Questions
        - heading "FAQ" [level=2] [ref=e3209]
        - generic [ref=e3210]:
          - generic [ref=e3211]:
            - generic [ref=e3212]: Do I have to install or host anything?
            - paragraph [ref=e3213]: No. Point your client at https://mcp.freedcamp.com/mcp and authorize with your own Freedcamp API key and secret in the browser. There is nothing to download and nothing to keep running.
          - generic [ref=e3214]:
            - generic [ref=e3215]: Can my whole team use it?
            - paragraph [ref=e3216]: Yes — everyone points at the same endpoint and completes their own OAuth authorization with their own Freedcamp credentials. Each bearer token gets its own isolated handler, so sessions never mix.
          - generic [ref=e3217]:
            - generic [ref=e3218]: Can the AI see projects I do not have access to?
            - paragraph [ref=e3219]: No. Every call is signed with your own API credentials, so the server can only ever see and change what you can see and change in Freedcamp.
          - generic [ref=e3220]:
            - generic [ref=e3221]: Why does it keep telling me to call fc_get_groups_projects?
            - paragraph [ref=e3222]: Because almost every other tool needs a project_id, list_id or user_id, and that one call returns all of them keyed by readable name. The server's own instructions tell clients to fetch it once and reuse it.
          - generic [ref=e3223]:
            - generic [ref=e3224]: How do I create a subtask?
            - paragraph [ref=e3225]: Call fc_add_task with h_parent_id set to the parent task. The parent must live in the same list and cannot itself be a subtask.
          - generic [ref=e3226]:
            - generic [ref=e3227]: What is the difference between list_id and task_group_id?
            - paragraph [ref=e3228]: They are the same field. list_id is the current name, task_group_id is the legacy alias — send one, not both.
          - generic [ref=e3229]:
            - generic [ref=e3230]: Can I change many tasks at once?
            - paragraph [ref=e3231]: fc_batch_edit_tasks takes up to 500 task IDs and applies the same status, priority, assignees, dates, tags, custom fields, milestone or parent to all of them in one request.
          - generic [ref=e3232]:
            - generic [ref=e3233]: Is there a local or stdio version?
            - paragraph [ref=e3234]: Not at the moment — OAuth over the hosted HTTPS endpoint is the only supported transport, which is why there are no environment variables or npx commands anywhere in this guide.
