          - generic [ref=e3150]: Trust
        - heading "Security & limits" [level=2] [ref=e3152]
        - paragraph [ref=e3153]: The server holds no data of its own. It is a typed, annotated surface over the Freedcamp REST API, running as whoever authorized it.
        - generic [ref=e3154]:
          - generic [ref=e3155]:
            - generic [ref=e3156]: Per-user credentials
            - paragraph [ref=e3157]: Each bearer token carries one user’s own encrypted API credentials, and each token gets its own handler. Two people on the same endpoint never see each other’s workspace.
          - generic [ref=e3158]:
            - generic [ref=e3159]: Nothing persisted
            - paragraph [ref=e3160]: Credentials live only inside the encrypted bearer token your client holds. Nothing is written to disk, and there is no config file on your machine holding an API secret in plain text.
          - generic [ref=e3161]:
            - generic [ref=e3162]: HMAC-signed upstream
            - paragraph [ref=e3163]: Requests to Freedcamp are signed per call. Your API secret is used to compute the signature, not transmitted as a credential.
          - generic [ref=e3164]:
            - generic [ref=e3165]: Your own account's limits
            - paragraph [ref=e3166]: There is no separate quota — you inherit the Freedcamp API's own rate limiting and your plan's permissions. A tool can never do more than you can.
        - generic [ref=e3168]:
          - generic [ref=e3169]: Destructive tools are real
          - paragraph [ref=e3170]:
            - code [ref=e3171]: fc_delete_project
            - text: ","
            - code [ref=e3172]: fc_delete_account
            - text: and the other
            - code [ref=e3173]: fc_delete_*
            - text: tools act immediately and are not undoable from here. They are annotated destructive so your client can ask first — leave those confirmations on.
